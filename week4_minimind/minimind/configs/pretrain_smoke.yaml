experiment:
  experiment_id: pretrain_smoke_001
  purpose: "验证 MiniMind Pretrain 完整训练链路"
  source_commit: "7a9137d"
  # Record the code actually used at run time with: git rev-parse HEAD
  repo_commit_at_run: null

data:
  name: pretrain_smoke
  version: pretrain_smoke_v1
  path: "../dataset/pretrain_smoke.jsonl"
  samples: 128

model:
  vocab_size: 6400
  hidden_size: 128
  num_hidden_layers: 2
  num_attention_heads: 8
  num_key_value_heads: 4
  use_moe: false
  model_params: "1.26M"

training:
  epochs: 1
  max_seq_len: 64

  micro_batch_size: 2
  gradient_accumulation_steps: 2
  world_size: 1
  effective_batch_size: 4

  micro_steps: 64
  optimizer_updates: 32

  optimizer: AdamW
  learning_rate: 5e-4
  lr_schedule: cosine_decay
  warmup_steps: 0

  grad_clip: 1.0
  precision: bfloat16
  device: mps

runtime:
  num_workers: 0
  seed: 42
  log_interval: 1
  save_interval: 1000

checkpoint:
  weight_name: smoke_pretrain
  model_checkpoint: "../checkpoints/smoke_pretrain_128.pth"
  resume_checkpoint: "../checkpoints/smoke_pretrain_128_resume.pth"

result:
  first_loss: 8.7192
  final_loss: 6.3709
  first_lr: 0.00049973
  final_lr: 0.00005000
  status: success
